<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" fill="none" role="img" aria-label="New conversation and history UI illustration">
  <rect width="440" height="168" rx="12" fill="#F4F7FF"/>
  <!-- left sidebar -->
  <rect x="20" y="14" width="168" height="140" rx="10" fill="#FFFFFF" stroke="#E7EDF7"/>
  <!-- New conversation -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="32" y="26" width="144" height="30" rx="8" fill="#FFFFFF"/>
    <g transform="translate(40 33)" stroke="#4E5969" stroke-width="1.6" stroke-linecap="round" fill="none">
      <rect x="0.5" y="0.5" width="13" height="13" rx="3" stroke="#4E5969"/>
      <line x1="7" y1="4" x2="7" y2="10"/>
      <line x1="4" y1="7" x2="10" y2="7"/>
    </g>
    <text x="62" y="41" fill="#272E3B" font-size="10" font-weight="500" dominant-baseline="central">New conversation</text>
    <!-- Conversation history (active) -->
    <rect x="32" y="60" width="144" height="30" rx="8" fill="#EAF1FF"/>
    <g transform="translate(40 67)" stroke="#165DFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12.5 11.5a1.5 1.5 0 0 1-1.5 1.5H5.5L3 15.5V4.5A1.5 1.5 0 0 1 4.5 3h9a1.5 1.5 0 0 1 1.5 1.5z"/>
      <circle cx="6" cy="8" r="0.7" fill="#165DFF" stroke="none"/>
      <circle cx="8.5" cy="8" r="0.7" fill="#165DFF" stroke="none"/>
      <circle cx="11" cy="8" r="0.7" fill="#165DFF" stroke="none"/>
    </g>
    <text x="62" y="75" fill="#165DFF" font-size="10" font-weight="500" dominant-baseline="central">Conversation history</text>
    <text x="164" y="75" text-anchor="end" fill="#165DFF" font-size="9" font-weight="500" dominant-baseline="central">6</text>
    <!-- session list -->
    <rect x="36" y="98" width="136" height="22" rx="6" fill="#F7F8FA"/>
    <text x="48" y="109" fill="#272E3B" font-size="9" dominant-baseline="central">Session name</text>
    <rect x="36" y="124" width="136" height="22" rx="6" fill="#F7F8FA"/>
    <text x="48" y="135" fill="#272E3B" font-size="9" dominant-baseline="central">Injection mold technical requirements</text>
  </g>
  <!-- right preview -->
  <rect x="200" y="14" width="220" height="140" rx="10" fill="#FFFFFF" stroke="#E7EDF7"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="216" y="42" fill="#1D2129" font-size="11" font-weight="600" dominant-baseline="central">Session name</text>
    <text x="216" y="62" fill="#A9AEB8" font-size="9" dominant-baseline="central">Injection Mold Rules</text>
    <rect x="216" y="80" width="188" height="56" rx="8" fill="#F8FAFC"/>
    <text x="310" y="108" text-anchor="middle" fill="#A9AEB8" font-size="9" dominant-baseline="central">Conversation preview area</text>
  </g>
</svg>
